version: 2
updates:
  # JS/TS dependencies (pnpm workspace, resolved from the root lockfile)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # All security fixes batched into a single PR across the workspace.
      # Keeps vulnerability remediation as one reviewable, testable unit
      # instead of one PR per advisory.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Low-risk routine bumps (minor + patch) in a single PR. Safe to
      # review/merge together; CI gates them.
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Major bumps grouped into their own PR so breaking changes are
      # isolated from the low-risk group, but still consolidated rather
      # than one PR per package.
      npm-major:
        applies-to: version-updates
        update-types:
          - major
    labels:
      - dependencies

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - ci
      - dependencies
