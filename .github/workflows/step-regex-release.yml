name: step-regex-release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build, test and pack without publishing"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "step-regex-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -C packages/step-regex build

      - name: Test
        run: pnpm --filter @suisui/step-regex test

      - name: Typecheck
        run: pnpm --filter @suisui/step-regex typecheck

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./packages/step-regex/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#step-regex-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        working-directory: packages/step-regex
        run: npm publish --dry-run --access public

      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        working-directory: packages/step-regex
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
